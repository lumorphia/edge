name: ci

# PR では Caddyfile の書式と中身、compose の構文、シークレットの混入を確かめる。
# main への push (develop -> main のマージ) では、Caddyfile を入れたイメージを作って latest を付ける。
# 本番は edge の doco-cd が latest の digest の変化で入れ替える (ADR-0001)
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: イメージ (公開しない)
        run: docker build -t edge-caddy:ci .
      # Caddy は tls の証明書のファイルを読むので、仮の証明書を作って渡す
      - name: Caddyfile の中身
        run: |
          mkdir -p .ci-certs
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -days 1 \
            -subj "/CN=*.lumorphia.com" -keyout .ci-certs/origin.key -out .ci-certs/origin.pem
          docker run --rm -v "$PWD/.ci-certs:/etc/caddy/certs:ro" edge-caddy:ci \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Caddyfile の書式
        run: docker run --rm edge-caddy:ci caddy fmt /etc/caddy/Caddyfile | diff -u Caddyfile -
      - name: compose の構文
        run: |
          docker network create lumorphia-edge
          EDGE_CERTS_DIR=/tmp/certs docker compose -f compose.yaml config --quiet
          docker compose -f doco-cd/compose.yaml config --quiet
      # lumorphia/platform の security.yml と同じ gitleaks (Node を持たないので直接動かす)
      - name: gitleaks (履歴全体)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner --verbose .

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.1.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/lumorphia/edge-caddy:sha-${{ github.sha }}
            ghcr.io/lumorphia/edge-caddy:latest
